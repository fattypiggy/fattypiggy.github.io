title:            William's Blog
description:      The Wolrd of William Jing
keyword: William Jing, 经纬, 前端, 前端开发, Angular, 个人分享, 记录生活

# Your site's domain goes here (eg: https://mmistakes.github.io, http://yourdomain.com, etc)
# When testing locally leave blank or use http://localhost:4000
url: https://www.williamjing.com

# Images folder
imageFolder: images

# Navigation links
nav:
  home: '/'
  tags: '/tags.html'

# Owner/author information
author: William Jing
avatar: /images/avatar.jpg
bio: 心之所向，身之所往。

# Search
search: true

# Night mode
nightMode: true

# Analytics and webmaster tools stuff goes here
google_analytics:   UA-104408878-2

# Comments 评论功能
comments:
  disqus: true
  disqus_url: 'https://myblog-williamjing.disqus.com/embed.js'

# MathJax 公式支持 by Ray-Eldath
mathjax: true

# Share
social-share: true
social-share-items: ['wechat', 'weibo', 'douban', 'twitter']

# theme color 主题皮肤
theme-color: 'default'  # pink or default

# Post header background patterns (when the post no cover): circuitBoard, overlappingCircles, food, glamorous, ticTacToe, seaOfClouds
postPatterns: 'food'

# SNS settings 配置社交网站
# url: email, weibo, zhihu, twitter, instagram, juejin, github, douban, facebook, dribble, uicn, jianshu, medium, linkedin
sns:
  # email: monkeykingisback@gmail.com
  github: '//github.com/fattypiggy'

# Tags 设置标签
recommend-tags: true # whether or not display recommend-tags on the sidebar
recommend-condition-size: 12 # a tag will be recommended if the size of it is more than this value

# Build settings
paginate: 6
paginate_path: 'page:num'
exclude: ['node_modules', 'dev', 'package.json', 'gulpfile.js', '.gitignore', 'README.md']

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# RSS
RSS: false

# Permalink
# See: https://github.com/kaeyleo/jekyll-theme-H2O/issues/35
permalink: /:year/:month/:day/:title.html

# Plugins
plugins: [jekyll-paginate]
